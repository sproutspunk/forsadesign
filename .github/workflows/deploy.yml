name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Disable Cloudflare security challenge
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          zone_id="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            'https://api.cloudflare.com/client/v4/zones?name=forsadesign.co.uk' \
            | jq --raw-output '.result[0].id // empty')"
          if [[ -z "$zone_id" ]]; then
            echo "::error::Cloudflare zone forsadesign.co.uk was not found."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"value":"essentially_off"}' \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/settings/security_level" \
            | jq --exit-status '.success == true' > /dev/null

          curl --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"value":"off"}' \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/settings/bot_fight_mode" \
            | jq --exit-status 'if .success == true then true else ("Bot Fight Mode setting was not changed: " + (.errors | tostring) | stderr | false) end' \
            || true

          rulesets="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/rulesets")" \
            || {
              echo "::warning::Could not read Cloudflare rulesets; continuing with deployment."
              rulesets='{"result":[]}'
            }
          printf '%s' "$rulesets" \
            | jq --raw-output '.result[] | select(.phase == "http_request_firewall_custom") | .id' \
            | while read -r ruleset_id; do
                [[ -n "$ruleset_id" ]] || continue
                ruleset="$(curl --fail-with-body --silent --show-error \
                  --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                  "https://api.cloudflare.com/client/v4/zones/$zone_id/rulesets/$ruleset_id")" \
                  || {
                    echo "::warning::Could not read Cloudflare ruleset $ruleset_id; continuing."
                    continue
                  }
                printf '%s' "$ruleset" \
                  | jq --raw-output '.result.rules[]? | select(.enabled != false and (.action == "managed_challenge" or .action == "challenge" or .action == "js_challenge")) | .id' \
                  | while read -r rule_id; do
                      [[ -n "$rule_id" ]] || continue
                      curl --fail-with-body --silent --show-error \
                        --request PATCH \
                        --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                        --header 'Content-Type: application/json' \
                        --data '{"enabled":false}' \
                        "https://api.cloudflare.com/client/v4/zones/$zone_id/rulesets/$ruleset_id/rules/$rule_id" \
                        | jq --exit-status '.success == true' > /dev/null \
                        && echo "Disabled Cloudflare WAF challenge rule $rule_id." \
                        || echo "::warning::Could not disable Cloudflare WAF challenge rule $rule_id; continuing."
                    done
              done

      - name: Deploy API Worker
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @workspace/forsa-api-worker run deploy

      - name: Build
        run: pnpm --filter @workspace/forsa-design run build
        env:
          NODE_ENV: production
          # GA4 Measurement ID for this property.
          # Hardcoded because it is publicly visible in the client bundle
          # anyway; Vite inlines it at build time. Without it the GA4 script
          # is never injected and no events (cookie banner, contact/quote/
          # waitlist forms) reach GA4.
          VITE_GA_MEASUREMENT_ID: G-9QKVVE4QXE

      - name: Sync secrets to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "${{ secrets.PROTON_SMTP_USER }}"     | pnpm exec wrangler pages secret put PROTON_SMTP_USER     --project-name=forsadesign
          printf '%s' "${{ secrets.PROTON_SMTP_PASS }}"     | pnpm exec wrangler pages secret put PROTON_SMTP_PASS     --project-name=forsadesign
          printf '%s' "${{ secrets.PROTON_SMTP_HOST }}"     | pnpm exec wrangler pages secret put PROTON_SMTP_HOST     --project-name=forsadesign
          printf '%s' "${{ secrets.PROTON_SMTP_PORT }}"     | pnpm exec wrangler pages secret put PROTON_SMTP_PORT     --project-name=forsadesign

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          export CLOUDFLARE_API_TOKEN
          pnpm exec wrangler pages deploy artifacts/forsa-design/dist/public --project-name=forsadesign --commit-dirty=true

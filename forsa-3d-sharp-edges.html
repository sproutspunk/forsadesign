<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forsa Design — 3D with Sharp Cube Edges</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0f1724;
        overflow: hidden;
      }
      #canvas-container {
        width: 100vw;
        height: 100vh;
      }
      canvas {
        display: block;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="canvas-container"></div>

    <script type="module">
      import * as THREE from "three";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

      const container = document.getElementById("canvas-container");
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f1724);
      scene.fog = new THREE.FogExp2(0x0f1724, 0.08);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        100,
      );
      camera.position.set(0, 0, 6);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ReinhardToneMapping;
      container.appendChild(renderer.domElement);

      // === BLOOM ===
      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      const bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        1.2,
        0.4,
        0.1,
      );
      composer.addPass(bloomPass);

      const gold = 0xc9a96e;

      // === MATERIALS ===
      const wireMat = new THREE.MeshBasicMaterial({
        color: gold,
        wireframe: true,
        transparent: true,
        opacity: 0.35,
      });
      const glowMat = new THREE.MeshBasicMaterial({
        color: gold,
        transparent: true,
        opacity: 0.12,
        side: THREE.BackSide,
      });

      // === SPHERE ===
      const sphereGroup = new THREE.Group();
      const sphere = new THREE.Mesh(new THREE.SphereGeometry(1.6, 32, 32), wireMat);
      sphereGroup.add(sphere);
      sphereGroup.add(new THREE.Mesh(new THREE.SphereGeometry(1.7, 32, 32), glowMat));
      scene.add(sphereGroup);

      // === CUBE WITH SHARP EDGES ===
      const cubeGroup = new THREE.Group();
      const cubeSize = 1.2;

      // 1. Wireframe body (subtle)
      const cubeBody = new THREE.Mesh(
        new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize),
        new THREE.MeshBasicMaterial({
          color: gold,
          wireframe: true,
          transparent: true,
          opacity: 0.25,
        }),
      );
      cubeGroup.add(cubeBody);

      // 2. SHARP OUTER EDGES — EdgesGeometry + LineSegments
      // To daje wyraźne, ostre linie krawędziowe zamiast siatki trójkątów
      const edgesGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize));
      const edgesMat = new THREE.LineBasicMaterial({
        color: gold,
        transparent: true,
        opacity: 0.9,
      });
      const edges = new THREE.LineSegments(edgesGeo, edgesMat);
      cubeGroup.add(edges);

      // 3. INNER CUBE — mniejszy sześcian z własnymi krawędziami
      const innerSize = cubeSize * 0.55;
      const innerCube = new THREE.Mesh(
        new THREE.BoxGeometry(innerSize, innerSize, innerSize),
        new THREE.MeshBasicMaterial({
          color: gold,
          wireframe: true,
          transparent: true,
          opacity: 0.2,
        }),
      );
      cubeGroup.add(innerCube);

      const innerEdgesGeo = new THREE.EdgesGeometry(
        new THREE.BoxGeometry(innerSize, innerSize, innerSize),
      );
      const innerEdgesMat = new THREE.LineBasicMaterial({
        color: gold,
        transparent: true,
        opacity: 0.7,
      });
      const innerEdges = new THREE.LineSegments(innerEdgesGeo, innerEdgesMat);
      cubeGroup.add(innerEdges);

      // 4. CROSS LINES — przekątne wewnątrz sześcianu (dodają wrażenie deformacji przy rotacji)
      const crossPoints = [];
      // Przekątne przeciwległych krawędzi
      const h = cubeSize / 2;
      crossPoints.push(
        new THREE.Vector3(-h, -h, -h),
        new THREE.Vector3(h, h, h),
        new THREE.Vector3(-h, -h, h),
        new THREE.Vector3(h, h, -h),
        new THREE.Vector3(-h, h, -h),
        new THREE.Vector3(h, -h, h),
        new THREE.Vector3(-h, h, h),
        new THREE.Vector3(h, -h, -h),
      );
      const crossGeo = new THREE.BufferGeometry().setFromPoints(crossPoints);
      const crossMat = new THREE.LineBasicMaterial({
        color: gold,
        transparent: true,
        opacity: 0.4,
      });
      const crossLines = new THREE.LineSegments(crossGeo, crossMat);
      cubeGroup.add(crossLines);

      // 5. Aura wokół całego sześcianu
      const cubeAura = new THREE.Mesh(
        new THREE.BoxGeometry(cubeSize * 1.1, cubeSize * 1.1, cubeSize * 1.1),
        glowMat,
      );
      cubeGroup.add(cubeAura);

      scene.add(cubeGroup);

      // === CORE LIGHT ===
      const coreLight = new THREE.PointLight(gold, 2, 10);
      scene.add(coreLight);

      // === HALFTONE WAVE BACKGROUND ===
      const halftoneVertex = `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

      const halftoneFragment = `
  uniform float uTime;
  uniform vec2 uResolution;
  varying vec2 vUv;
  void main() {
    vec2 uv = vUv;
    uv.x *= uResolution.x / uResolution.y;
    vec2 center = vec2(uResolution.x / uResolution.y * 0.5, 0.5);
    float dist = distance(uv, center);
    float density = 80.0;
    vec2 grid = fract(uv * density) - 0.5;
    float dotDist = length(grid);
    float wave = sin(dist * 15.0 - uTime * 3.0) * 0.5 + 0.5;
    float wave2 = sin(dist * 25.0 - uTime * 4.5 + 1.0) * 0.5 + 0.5;
    float dotSize = 0.35 * (wave * 0.7 + wave2 * 0.3);
    float dot = smoothstep(dotSize, dotSize - 0.08, dotDist);
    vec3 color = vec3(0.788, 0.663, 0.431);
    float alpha = dot * (1.0 - dist * 0.6) * 0.5;
    gl_FragColor = vec4(color, alpha);
  }
`;

      const halftoneMat = new THREE.ShaderMaterial({
        vertexShader: halftoneVertex,
        fragmentShader: halftoneFragment,
        uniforms: {
          uTime: { value: 0 },
          uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        },
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
      });
      const halftoneMesh = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), halftoneMat);
      halftoneMesh.position.z = -4;
      scene.add(halftoneMesh);

      // === PARTICLES ===
      const pCount = 300;
      const pPos = new Float32Array(pCount * 3);
      for (let i = 0; i < pCount * 3; i++) pPos[i] = (Math.random() - 0.5) * 10;
      const pGeo = new THREE.BufferGeometry();
      pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
      const pMat = new THREE.PointsMaterial({
        size: 0.018,
        color: gold,
        transparent: true,
        opacity: 0.5,
        blending: THREE.AdditiveBlending,
      });
      const particles = new THREE.Points(pGeo, pMat);
      scene.add(particles);

      // === SMOOTH ROTATION ===
      const clock = new THREE.Clock();
      let sY = 0,
        sX = 0,
        cY = 0,
        cZ = 0;
      let pSY = 0,
        pSX = 0,
        pCY = 0,
        pCZ = 0;

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        const t = clock.elapsedTime;

        halftoneMat.uniforms.uTime.value = t;

        sY += 0.3 * dt;
        sX += 0.15 * dt;
        pSY += (sY - pSY) * 0.12;
        pSX += (sX - pSX) * 0.12;
        sphereGroup.rotation.y = pSY;
        sphereGroup.rotation.x = pSX;

        cY += -0.5 * dt;
        cZ += 0.2 * dt;
        pCY += (cY - pCY) * 0.12;
        pCZ += (cZ - pCZ) * 0.12;
        cubeGroup.rotation.y = pCY;
        cubeGroup.rotation.z = pCZ;

        const beat = Math.sin(t * 3.0) * 0.5 + 0.5;
        const beat2 = Math.sin(t * 4.5 + 1.0) * 0.5 + 0.5;
        const combined = beat * 0.6 + beat2 * 0.4;

        coreLight.intensity += (1.5 + combined * 1.5 - coreLight.intensity) * 0.1;
        bloomPass.strength += (1.0 + combined * 0.5 - bloomPass.strength) * 0.08;

        const scalePulse = 1.0 + combined * 0.03;
        sphereGroup.scale.setScalar(scalePulse);
        cubeGroup.scale.setScalar(1.0 + (1.0 - combined) * 0.03);

        sphereGroup.position.y += (Math.sin(t * 0.5) * 0.1 - sphereGroup.position.y) * 0.05;
        cubeGroup.position.y += (Math.sin(t * 0.5 + 1) * 0.1 - cubeGroup.position.y) * 0.05;

        particles.rotation.y += 0.0005;

        composer.render();
      }

      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
        halftoneMat.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
